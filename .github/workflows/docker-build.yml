name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  MONITOR_IMAGE: ghcr.io/${{ github.repository }}/monitor
  TECHNITIUM_IMAGE: ghcr.io/${{ github.repository }}/technitium

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump and push tag
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import subprocess

          msg = os.environ["COMMIT_MSG"]
          first_line = msg.splitlines()[0] if msg else ""

          bump = "none"
          if re.match(r"^[a-z]+!:", first_line, re.IGNORECASE):
              bump = "major"
          elif re.match(r"^feat:", first_line, re.IGNORECASE):
              bump = "minor"
          elif re.match(r"^fix:", first_line, re.IGNORECASE):
              bump = "patch"

          print(f"bump={bump}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"bump={bump}\n")

          if bump != "none":
              try:
                  latest = subprocess.check_output(
                      ["git", "describe", "--tags", "--match", "v*", "--abbrev=0"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except subprocess.CalledProcessError:
                  latest = "v0.0.0"

              version = latest.lstrip("v")
              major, minor, patch = map(int, version.split("."))

              if bump == "major":
                  major += 1
                  minor = 0
                  patch = 0
              elif bump == "minor":
                  minor += 1
                  patch = 0
              else:
                  patch += 1

              new_tag = f"v{major}.{minor}.{patch}"
              print(f"new_tag={new_tag}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"new_tag={new_tag}\n")

              subprocess.run(["git", "tag", new_tag], check=True)
              subprocess.run(["git", "push", "origin", new_tag], check=True)
          PYEOF

  build-monitor:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.bump != 'none'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for monitor image
        id: meta-monitor
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MONITOR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_tag }}

      - name: Build and push monitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-monitor.outputs.tags }}
          labels: ${{ steps.meta-monitor.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-technitium:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.bump != 'none'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for technitium image
        id: meta-technitium
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TECHNITIUM_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_tag }}

      - name: Build and push technitium image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.technitium
          push: true
          tags: ${{ steps.meta-technitium.outputs.tags }}
          labels: ${{ steps.meta-technitium.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
