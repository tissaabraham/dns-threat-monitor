# Upstream DNS servers
server=1.1.1.1
server=8.8.8.8

# Don't use /etc/resolv.conf
no-resolv

# Don't forward bare names or private IP lookups
domain-needed
bogus-priv

# Listen on all interfaces
listen-address=0.0.0.0
bind-interfaces

# Logging - essential for the project
log-queries
log-facility=/var/log/dnsmasq.log

# Cache
cache-size=1000