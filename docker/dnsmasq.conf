# DNSMASQ Configuration for DNS Threat Monitor

# Listen on all interfaces
listen-address=0.0.0.0

# DNS port
port=53

# Enable DHCP logging
log-queries
log-facility=/var/log/dnsmasq.log

# Set upstream DNS servers (Google DNS)
server=8.8.8.8
server=8.8.4.4

# Enable cache
cache-size=10000

# Log DHCP requests
log-dhcp

# Optional: Use specific interface
# interface=eth0

# Optional: Read additional hosts file
# addn-hosts=/etc/dnsmasq.d/hosts.list

