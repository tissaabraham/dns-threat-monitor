services:
  technitium:
    build:
      context: .
      dockerfile: Dockerfile.technitium
    container_name: technitium_dns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "5380:5380"
    volumes:
      - ./data/technitium:/etc/dns
      - ./logs/technitium:/var/log/technitium
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=UTC

  monitor:
    build: .
    container_name: dns_monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./threats.txt:/app/threats.txt
      - ./logs/technitium:/var/log/technitium
    cap_add:
      - NET_ADMIN
      - NET_RAW
    tty: true
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    depends_on:
      - technitium
