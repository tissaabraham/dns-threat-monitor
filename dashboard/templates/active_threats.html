<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Threats – DNS Threat Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f6f8fb; }
        .sidebar {
            background: #16213e;
            min-height: 100vh;
            color: #fff;
        }
        .sidebar .nav-link {
            color: #bfc9da;
            font-weight: 500;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            background: #233554;
            color: #fff;
        }
        .sidebar .logo {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 32px 0 24px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .content-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(22,33,62,0.06);
            padding: 24px;
            margin-top: 32px;
            margin-bottom: 24px;
        }
        .footer {
            text-align: center;
            color: #bfc9da;
            font-size: 0.95rem;
            margin: 32px 0 0 0;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar py-4">
            <div class="logo ps-3"><span>Shield</span>DNS Threat Monitor</div>
            <ul class="nav flex-column ps-3">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/live-monitoring">Live Monitoring</a></li>
                <li class="nav-item"><a class="nav-link active" href="/active-threats">Active Threats</a></li>
                <li class="nav-item"><a class="nav-link" href="/logs">Logs</a></li>
            </ul>
        </nav>
        <!-- Main -->
        <main class="col-md-10 ms-sm-auto px-4">
            <div class="topbar">
                <div class="fs-5 fw-bold">Active Threats</div>
                <div class="user">
                    <div class="dropdown">
                        <span class="dropdown-toggle text-dark fw-semibold d-flex align-items-center gap-2"
                              data-bs-toggle="dropdown" aria-expanded="false" role="button" style="cursor:pointer;">
                            <span style="font-size:1.5rem;">&#128100;</span>
                            <span id="topbar-username">Username</span>
                        </span>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text fw-bold" id="dropdown-username">Username</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/profile">My Profile</a></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logout-btn">&#8594; Log Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <div class="fs-6 fw-bold">Active Threats <span class="badge bg-danger ms-2" id="threat-count">0</span></div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadThreats()">&#8635; Refresh</button>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Time</th>
                                <th>Domain</th>
                                <th>Severity</th>
                                <th>Rule</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody id="threats-table-body">
                            <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="footer">© 2025 DNS Threat Monitor. All rights reserved.</div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function loadThreats() {
        fetch('/api/alerts').then(r=>r.json()).then(rows=>{
            document.getElementById('threat-count').textContent = rows.length;
            const badges = {High:'danger', Medium:'warning', Low:'success'};
            const html = rows.length
                ? rows.map(a=>`<tr>
                    <td>${a.timestamp ? new Date(a.timestamp).toLocaleString() : '-'}</td>
                    <td>${a.domain||'-'}</td>
                    <td><span class="badge bg-${badges[a.severity]||'secondary'}">${a.severity||'-'}</span></td>
                    <td>${a.rule_name||'-'}</td>
                    <td>${a.score!=null ? a.score : '-'}</td>
                  </tr>`).join('')
                : '<tr><td colspan="5" class="text-center text-muted">No active threats detected</td></tr>';
            document.getElementById('threats-table-body').innerHTML = html;
        }).catch(()=>{
            document.getElementById('threats-table-body').innerHTML='<tr><td colspan="5" class="text-center text-danger">Failed to load data</td></tr>';
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const saved = localStorage.getItem('dtm_username');
        if (saved) {
            document.getElementById('topbar-username').textContent = saved;
            document.getElementById('dropdown-username').textContent = saved;
        }
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('dtm_username');
            localStorage.removeItem('dtm_fullname');
            localStorage.removeItem('dtm_email');
            document.getElementById('topbar-username').textContent = 'Username';
            document.getElementById('dropdown-username').textContent = 'Username';
        });
        loadThreats();
        setInterval(loadThreats, 10000);
    });
</script>
</body>
</html>
